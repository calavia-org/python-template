name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Semantic Release pushes a tag and publishes a GitHub Release, and comments on
# the issues/PRs it closes, so it needs write access to all three scopes.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
